###############################################################################
# docker-compose.shared.yml - Shared infrastructure services
#
# PostgreSQL est installe nativement sur le VPS (port 5432).
# Chaque projet a sa propre base, creee par deploy.sh.
###############################################################################

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: generateu_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - generateu_network

networks:
  generateu_network:
    name: generateu_network
    driver: bridge
