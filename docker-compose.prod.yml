services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: prod
    container_name: ${PROJECT_NAME}_app
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env.prod.local
    environment:
      FRANKENPHP_WORKERS: ${FRANKENPHP_WORKERS:-8}
    restart: always
    networks:
      - generateu_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  generateu_network:
    external: true
